<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Continuity">
  <title>Continuity</title>
  <!-- A C for Continuity, drawn as one unbroken arc: the thread that survives
     between sessions. It terminates in a node - a single captured claim. -->
  <defs><linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient></defs>
  <rect width="96" height="96" rx="22" fill="url(#tg)"/>
  <g transform="translate(48,48) scale(0.66) translate(-48,-48)">
    <path d="M70 26 A 26 26 0 1 0 70 70" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
    <circle cx="72" cy="24" r="8.5" fill="#fff"/>
  </g>
</svg>
