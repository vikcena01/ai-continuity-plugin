<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 48" width="181" height="48" role="img" aria-label="Continuity">
  <title>Continuity</title>
  <!-- A C for Continuity, drawn as one unbroken arc: the thread that survives
     between sessions. It terminates in a node - a single captured claim. -->
  <defs><linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient></defs>
  <g transform="translate(-6.25 4.21) scale(0.4167)">
    <path d="M70 26 A 26 26 0 1 0 70 70" fill="none" stroke="url(#dg)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="72" cy="24" r="8.5" fill="#8B5CF6"/>
  </g>
  <text x="40" y="33.25" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.6" fill="#E2E8F0">Continuity</text>
</svg>
