<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Continuity">
  <title>Continuity</title>
  <!-- A superseded claim: it branches off the timeline and is archived, never deleted.
       Muted and thinner, because it is history rather than current state. -->
  <path d="M24 32 C 34 32, 42 30, 45 22" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="19" r="4" fill="#94A3B8"/>
  <!-- The append-only timeline of accepted state: git is the event log. -->
  <path d="M24 16 V 48" fill="none" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="24" cy="16" r="5.5" fill="#6366F1"/>
  <circle cx="24" cy="32" r="5.5" fill="#6366F1"/>
  <circle cx="24" cy="48" r="5.5" fill="#6366F1"/>
</svg>
