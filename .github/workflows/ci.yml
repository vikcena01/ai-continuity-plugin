name: ci

on:
  push:
    branches: [main]
    # Claim files are state, not code: they cannot break the build, and autonomous
    # capture commits them often. Skipping them keeps CI signal about code changes.
    paths-ignore:
      - '.continuity/**'
  pull_request:
  workflow_dispatch:

# Least privilege: the job only reads the repo. Without this the default
# GITHUB_TOKEN scope is broader than anything here needs, which matters more than
# usual for a repo whose whole purpose is other people installing its code.
permissions:
  contents: read

# Rapid pushes are normal here, so supersede rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck + bundle + all six suites
      - run: npm test

      # dist/ is committed so the plugin installs with no build step (d13), which
      # means a reviewer reads src/ while users RUN dist/. This step proves the two
      # agree: rebuild from source and fail if the committed bundle differs. It is
      # the only thing standing between committed dist/ and an unreviewable
      # supply-chain surface (rk11g9).
      - name: committed dist/ matches src/
        run: |
          npm run bundle
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ does not match src/. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist
            exit 1
          fi
          echo "dist/ is reproducible from src/"
